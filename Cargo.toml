[workspace]
resolver = "2"
members = ["crates/satsuma-core", "crates/satsuma-engine", "crates/satsuma-app"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
satsuma-core = { path = "crates/satsuma-core" }
satsuma-engine = { path = "crates/satsuma-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-pdf-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"
objc2-image-io = "0.3"
objc2-service-management = "0.3"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_WinRT", "Win32_Graphics_Imaging",
  "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_System_LibraryLoader",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_Media_Audio",
  "Win32_Media", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem", "Win32_Security", "Win32_Globalization", "Win32_System_Com_Urlmon",
  "Foundation", "Foundation_Collections", "Storage", "Storage_Streams", "Graphics_Imaging", "Data_Pdf", "Media_Ocr", "Globalization",
  "ApplicationModel_DataTransfer", "UI", "UI_ViewManagement", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Storage_Search", "Storage_FileProperties", "Win32_Graphics_Direct2D_Common",
] }

[profile.release]
lto = "thin"
codegen-units = 4
