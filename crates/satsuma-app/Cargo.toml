[package]
name = "satsuma-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Satsuma menu-bar app and command-line interface."

[[bin]]
name = "satsuma"
path = "src/main.rs"

[[bin]]
name = "satsuma-cli"
path = "src/bin/satsuma-cli.rs"

[features]
# Hidden `render-demo` command that renders the README video and screenshots.
demo = []

[dependencies]
satsuma-core.workspace = true
satsuma-engine.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-service-management.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
dunce = "1"
windows-core = "0.62"
windows-numerics = "0.3"
windows-collections = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
tiny-skia = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
