[package]
name = "satsuma-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local conversion backends for Satsuma (macOS: sips, textutil, PDFKit, CoreGraphics, CoreText; Windows: WIC, Windows.Data.Pdf, Windows.Media.Ocr, Edge). Both use tar and ffmpeg."

[dependencies]
satsuma-core.workspace = true
thiserror.workspace = true
serde_json.workspace = true
calamine = "0.36"
rust_xlsxwriter = "0.100"
csv = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
plist = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-pdf-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-text.workspace = true
objc2-image-io.workspace = true
objc2-vision = "0.3"
objc2-core-image = "0.3"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "bmp", "gif", "webp", "ico"] }
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "raster-images"] }
lopdf = "0.45"
pdf-extract = "0.12"
base64 = "0.22"
tiff = "0.10"
windows = { workspace = true }
